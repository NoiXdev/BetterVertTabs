<!doctype html>
<!--
  Design preview of the sidebar without Firefox.
  Loads the real sidebar.html, replaces the browser API with dev-mock.js
  and then starts sidebar.js. Not part of the extension.
  Usage: start a web server in the repository root, then open /dev/preview.html.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterVertTabs – Preview</title>
  <link rel="stylesheet" href="../extension/sidebar/sidebar.css">
  <style>
    html { width: 280px; height: 640px; outline: 1px solid #444; }
    body { height: 640px; }
  </style>
</head>
<body>
  <script>
    (async () => {
      const html = await (await fetch("../extension/sidebar/sidebar.html")).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      doc.querySelectorAll("script").forEach((s) => s.remove());
      document.body.replaceChildren(...[...doc.body.childNodes].map((n) => document.importNode(n, true)));
      for (const src of ["dev-mock.js", "../extension/sidebar/sidebar.js"]) {
        await new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = reject;
          document.body.append(s);
        });
      }
    })();
  </script>
</body>
</html>
