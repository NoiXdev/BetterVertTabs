<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BetterVertTabs</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <main id="app">
    <section id="pinned" class="pinned-grid" aria-label="Pinned tabs"></section>

    <section id="groups" aria-label="Tab groups"></section>

    <div class="divider" role="separator"></div>

    <button id="new-tab" class="row new-tab" type="button">
      <span class="row-icon plus" aria-hidden="true"></span>
      <span class="row-title">New Tab</span>
    </button>

    <section id="tabs" class="tab-list" aria-label="Tabs"></section>
  </main>

  <footer id="bottom-bar">
    <button id="btn-new-group" class="icon-btn" type="button" title="New group">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 1.5h4.5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <span class="spacer"></span>
    <button id="btn-new-tab" class="icon-btn" type="button" title="New tab">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
  </footer>

  <div id="menu" class="context-menu" hidden></div>

  <script src="sidebar.js"></script>
</body>
</html>
