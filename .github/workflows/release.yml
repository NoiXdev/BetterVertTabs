# Publishes a new version on addons.mozilla.org and creates a GitHub release.
#
# Trigger: push a tag that matches the version in extension/manifest.json,
# e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# Needs the secrets MOZILLA_WEB_EXT_API_KEY and MOZILLA_WEB_EXT_API_SECRET
# (organization or repository secrets).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check that the tag matches the manifest version
        run: |
          manifest_version=$(node -p "require('./extension/manifest.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest_version"
            exit 1
          fi

      - run: npm run lint

      - run: npm run build

      - name: Sign and publish on addons.mozilla.org
        env:
          MOZILLA_WEB_EXT_API_KEY: ${{ secrets.MOZILLA_WEB_EXT_API_KEY }}
          MOZILLA_WEB_EXT_API_SECRET: ${{ secrets.MOZILLA_WEB_EXT_API_SECRET }}
        run: npm run sign

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(web-ext-artifacts/*.zip web-ext-artifacts/*.xpi)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "BetterVertTabs ${GITHUB_REF_NAME}" \
            --generate-notes
